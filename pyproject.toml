[project]
name = "kvsel"
version = "0.1.0"
description = "Does unreliable text steer visual-KV selection? Replay pipeline and analysis."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10",
    "torch>=2.4",
    # Exact pin: cache and attention internals change between versions.
    "transformers==4.57.6",
    "accelerate>=1.0",
    "protobuf>=4",
    "sentencepiece>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kvsel = "kvsel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kvsel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs the LLaVA tokenizer and image-processor config from the Hugging Face Hub"]
